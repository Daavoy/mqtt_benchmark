# HiveMQ Community Edition overlay for AUT0.
# Usage: docker compose -f docker-compose-aut0.yml -f docker-compose-aut0-hivemq.yml up
# Set in .env: BROKER_IMAGE=hivemq/hivemq-ce, BROKER_TYPE=hivemq, LOG_PATH=aut0_hivemq/qos<N>
services:
    broker:
        image: ${BROKER_IMAGE:-hivemq/hivemq-ce}
        environment:
            - HIVEMQ_LOG_LEVEL=INFO
        ports:
            # HiveMQ Prometheus extension metrics (mapped to host for prometheus scraping)
            - "9397:9399"
        volumes:
            - ./monitoring/hivemq-prometheus-extension:/opt/hivemq/extensions/hivemq-prometheus-extension
        healthcheck:
            test: ["CMD-SHELL", "sleep 5"]
            start_period: 30s
            interval: 60s
            timeout: 10s
