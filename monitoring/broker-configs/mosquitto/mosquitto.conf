# Mosquitto configuration for AUT0 benchmark
# Anonymous connections allowed — add password_file for production use.

listener 1883
allow_anonymous true

# Raise the MQTT 5 Maximum Packet Size advertised in CONNACK to the protocol maximum.
# message_size_limit is the legacy MQTT 3.x option; max_packet_size is used by
# Mosquitto 2.1+ for MQTT 5 connections and sets what paho will actually enforce.
max_packet_size 268435455

# Disable on-disk persistence to avoid I/O skewing latency measurements
persistence false

# Enable $SYS topic tree so mosquitto-exporter can scrape broker statistics
sys_interval 5

log_type error
log_type warning
log_type notice
log_type information
