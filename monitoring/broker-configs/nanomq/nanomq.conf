# NanoMQ configuration for AUT0 benchmark
# Tested against emqx/nanomq:latest (0.18+)

mqtt {
    property_size = 32
    max_packet_size = 268435455
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
    max_inflight_window = 2048
    max_awaiting_rel = 10
    await_rel_timeout = 10s
    session_expiry_interval = 7200s
    max_topic_levels = 7
    max_subscriptions = 0
}

listeners.tcp {
    bind = "0.0.0.0:1883"
}

# HTTP server — used for health checks and the REST metrics API (/api/v4/metrics)
# Note: NanoMQ metrics are returned as JSON, not Prometheus text format.
# Use a json_exporter sidecar or parse via run_load.py if Prometheus scraping is needed.
http_server {
    port = 8083
    limit_conn = 32
    # Disable auth for benchmark simplicity
    auth_type = none
}

log {
    to = [console]
    level = warn
}
